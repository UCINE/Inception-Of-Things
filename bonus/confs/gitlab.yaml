apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:9.5.10-ce.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - |
              printf '#!/bin/sh\nexit 0\n' > /bin/systemctl
              chmod +x /bin/systemctl
              exec /assets/wrapper
          ports:
            - containerPort: 80
            - containerPort: 22
          env:
            - name: GITLAB_ROOT_PASSWORD
              value: iotgitlab
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://localhost:8081'
                gitlab_rails['initial_root_password'] = 'iotgitlab'
                gitlab_rails['gitlab_shell_ssh_port'] = 22
                nginx['listen_port'] = 80
                nginx['listen_https'] = false
          volumeMounts:
            - name: gitlab-data
              mountPath: /var/opt/gitlab
            - name: gitlab-config
              mountPath: /etc/gitlab
            - name: gitlab-logs
              mountPath: /var/log/gitlab
            - name: gitlab-shm
              mountPath: /dev/shm
      volumes:
        - name: gitlab-data
          emptyDir: {}
        - name: gitlab-config
          emptyDir: {}
        - name: gitlab-logs
          emptyDir: {}
        - name: gitlab-shm
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  selector:
    app: gitlab
  ports:
    - name: web
      port: 80
      targetPort: 80
    - name: ssh
      port: 22
      targetPort: 22
  type: ClusterIP
